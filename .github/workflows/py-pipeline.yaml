name: "Pipeline"

on:
  push:
    branches: [ "main" ]
    paths:
      - "**/.py"

  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:


jobs: 
  build: 
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint 
        pip install bandit
        pip install isort 
        pip install -r FIAP-DevOps-Fase-02/services/analytics-service/requirements.txt
        # pip install -r FIAP-DevOps-Fase-02/services/flag-service/requirements.txt
        # pip install -r FIAP-DevOps-Fase-02/services/targeting-service/requirements.txt
    - name: check import organization
      run: |
        isort --check-only --diff $(git ls-files '*.py') || echo "Import organization issues found."
    - name: Analysing the code with pylint
      run: |
        pylint --exit-zero $(git ls-files '*.py')
    - name: Find vulnerabilityes with bandit
      run: | 
        bandit -r FIAP-DevOps-Fase-02/services -ll --exit-zero
        # python -m compileall -q FIAP-DevOps-Fase-02/services/flag-service/requirements.txt
        # python -m compileall -q FIAP-DevOps-Fase-02/services/targeting-service/requirements.txt
    - name: Find vulnerabilityes with bandit
      run: | 
        bandit -r FIAP-DevOps-Fase-02/services \
        --severity-level high \
        --confidence-level medium
        # bandit -r FIAP-DevOps-Fase-02/services -ll --exit-zero
        # python -m compileall -q FIAP-DevOps-Fase-02/services/flag-service/requirements.txt
        # python -m compileall -q FIAP-DevOps-Fase-02/services/targeting-service/requirements.tx
    - name: Build an image from Dockerfile
      run: |
        docker build \
        -t flag-image:${{ github.sha }} \
        -f FIAP-DevOps-Fase-02/services/flag-service/Dockerfile \
        FIAP-DevOps-Fase-02/services/flag-service
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@7b7aa264d83dc58691451798b4d117d53d21edfe
      with:
        image-ref: flag-image:${{ github.sha }}
        scan-type: image
        severity: CRITICAL
        exit-code: "1"
        ignore-unfixed: true